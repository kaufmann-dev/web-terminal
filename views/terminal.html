<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/vendor/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/jetbrains-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="dark terminal-body">
  <header class="terminal-header">
    <div class="terminal-header-main">
      <button id="sidebar-toggle" class="btn-icon sidebar-toggle" type="button" aria-controls="session-sidebar" aria-expanded="false" title="Show terminal sessions">
        <span class="sidebar-toggle-icon" aria-hidden="true"></span>
        <span class="sr-only">Show terminal sessions</span>
      </button>
      <span class="terminal-title">terminal.kaufmann.dev</span>
      <span id="active-session-label" class="active-session-label"></span>
    </div>
    <button id="logout-btn" class="btn-logout" title="Logout">Logout</button>
  </header>
  <main class="terminal-main">
    <aside id="session-sidebar" class="session-sidebar" aria-label="Terminal sessions">
      <div class="session-sidebar-header">
        <h1>Sessions</h1>
        <button id="sidebar-close" class="btn-icon sidebar-close" type="button" title="Hide terminal sessions">
          <span aria-hidden="true">×</span>
          <span class="sr-only">Hide terminal sessions</span>
        </button>
      </div>

      <form id="session-form" class="session-form">
        <label for="session-name">New session</label>
        <div class="session-form-row">
          <input id="session-name" name="sessionName" type="text" maxlength="32" pattern="[a-z0-9][a-z0-9-]{0,31}" placeholder="project-name" autocomplete="off" required>
          <button id="create-session-btn" class="btn-session-create" type="submit">Add</button>
        </div>
        <p class="session-name-hint">Lowercase letters, numbers, and hyphens.</p>
      </form>

      <div id="session-list" class="session-list" aria-label="Available sessions"></div>
      <p id="session-status" class="session-status" role="status" aria-live="polite"></p>
    </aside>

    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Hide terminal sessions"></button>

    <section class="terminal-workspace" aria-label="Active terminal">
      <div id="terminal-placeholder" class="terminal-placeholder">
        <p id="terminal-placeholder-message">Loading terminal sessions…</p>
      </div>
      <div id="terminal-host" class="terminal-host" aria-label="Terminal input" hidden></div>
      <div id="connection-status" class="connection-status" role="status" aria-live="polite" hidden></div>
      <div id="clipboard-status" class="clipboard-status" role="status" aria-live="polite" hidden></div>
    </section>

    <div id="mobile-terminal-controls" class="mobile-terminal-controls" role="group" aria-label="Terminal controls" hidden>
      <button class="mobile-terminal-key" type="button" data-terminal-control="modifier-ctrl" data-terminal-modifier="ctrl" aria-label="Toggle Control modifier" aria-pressed="false" disabled>Ctrl</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="modifier-shift" data-terminal-modifier="shift" aria-label="Toggle Shift modifier" aria-pressed="false" disabled>Shift</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="modifier-alt" data-terminal-modifier="alt" aria-label="Toggle Alt modifier" aria-pressed="false" disabled>Alt</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="paste" aria-label="Paste clipboard text or image" disabled>Paste</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="escape" aria-label="Send Escape" disabled>Esc</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="tab" aria-label="Send Tab" disabled>Tab</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="arrow-left" aria-label="Send left arrow" disabled>
        <svg class="mobile-terminal-key-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7"></path>
        </svg>
      </button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="arrow-up" aria-label="Send up arrow" disabled>
        <svg class="mobile-terminal-key-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7" transform="rotate(90 12 12)"></path>
        </svg>
      </button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="arrow-down" aria-label="Send down arrow" disabled>
        <svg class="mobile-terminal-key-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7" transform="rotate(-90 12 12)"></path>
        </svg>
      </button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="arrow-right" aria-label="Send right arrow" disabled>
        <svg class="mobile-terminal-key-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7" transform="rotate(180 12 12)"></path>
        </svg>
      </button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="home" aria-label="Send Home" disabled>Home</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="end" aria-label="Send End" disabled>End</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="page-up" aria-label="Send Page Up" disabled>PgUp</button>
      <button class="mobile-terminal-key" type="button" data-terminal-control="page-down" aria-label="Send Page Down" disabled>PgDn</button>
    </div>
  </main>
  <script src="/static/js/terminal.js"></script>
</body>
</html>
